<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <img src="../icons/icon.svg" alt="" width="20" height="20">
    <h1 data-i18n="extensionName"></h1>
    <button id="settings" class="icon-btn" type="button" data-i18n-title="popupSettings" data-i18n-aria-label="popupSettings">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M9.6 1.1a.8.8 0 0 0-.8-.6H7.2a.8.8 0 0 0-.8.6l-.3 1.5a5.6 5.6 0 0 0-1.2.7L3.5 2.8a.8.8 0 0 0-.9.3l-.8 1.4a.8.8 0 0 0 .2 1l1.1 1A5.7 5.7 0 0 0 3 8c0 .5 0 .9.1 1.4l-1.1 1a.8.8 0 0 0-.2 1l.8 1.4a.8.8 0 0 0 .9.4l1.4-.5c.4.3.8.5 1.2.7l.3 1.5c.1.4.4.6.8.6h1.6c.4 0 .7-.2.8-.6l.3-1.5c.4-.2.8-.4 1.2-.7l1.4.5c.4.1.7 0 .9-.4l.8-1.4a.8.8 0 0 0-.2-1l-1.1-1c.1-.5.1-.9.1-1.4s0-.9-.1-1.4l1.1-1a.8.8 0 0 0 .2-1l-.8-1.4a.8.8 0 0 0-.9-.3l-1.4.5a5.6 5.6 0 0 0-1.2-.7l-.3-1.5zM8 10.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
    </button>
  </header>

  <section class="quick" aria-labelledby="quick-heading">
    <h2 id="quick-heading" class="visually-hidden" data-i18n="quickHeading"></h2>
    <div class="quick-field">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M7 2.5a4.5 4.5 0 1 0 2.67 8.12l2.85 2.86a.75.75 0 1 0 1.06-1.06l-2.86-2.85A4.5 4.5 0 0 0 7 2.5zM4 7a3 3 0 1 1 6 0 3 3 0 0 1-6 0z"/></svg>
      <input id="quick-text" type="text" autocomplete="off" spellcheck="false" autocapitalize="off"
             data-i18n-placeholder="quickPlaceholder" data-i18n-aria-label="quickPlaceholder">
      <button id="quick-clear" class="icon-btn" type="button" data-i18n-title="quickClear" data-i18n-aria-label="quickClear" hidden>
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.28 3.22a.75.75 0 0 0-1.06 1.06L6.94 8l-3.72 3.72a.75.75 0 1 0 1.06 1.06L8 9.06l3.72 3.72a.75.75 0 1 0 1.06-1.06L9.06 8l3.72-3.72a.75.75 0 0 0-1.06-1.06L8 6.94 4.28 3.22z"/></svg>
      </button>
    </div>

    <div id="quick-panel" class="quick-panel" hidden>
      <p class="quick-note muted" data-i18n="quickNote"></p>
      <div class="quick-row">
        <select id="quick-type" data-i18n-aria-label="ruleTypeLabel">
          <option value="contains" data-i18n="typeContains"></option>
          <option value="site" data-i18n="typeSite"></option>
          <option value="prefix" data-i18n="typePrefix"></option>
          <option value="regex" data-i18n="typeRegex"></option>
        </select>
      </div>
      <div class="quick-row">
        <button id="quick-color" class="color-btn" type="button"><span class="dot" id="quick-dot"></span></button>
        <input id="quick-name" type="text" autocomplete="off" data-i18n-aria-label="ruleNameLabel">
      </div>
      <p id="quick-error" class="quick-error" role="alert" hidden></p>
      <div class="quick-head">
        <span id="quick-count" class="quick-count"></span>
        <button id="quick-save" class="link-btn" type="button" data-i18n="quickSave"></button>
      </div>
      <ul id="quick-preview" class="quick-preview"></ul>
    </div>
  </section>

  <main id="rules-section">
    <div class="section-head">
      <h2 data-i18n="popupRulesHeading"></h2>
    </div>

    <ul id="rules" class="rule-list"></ul>

    <div id="empty" class="empty" hidden>
      <p data-i18n="popupNoRules"></p>
      <button id="empty-add" class="btn ghost" type="button" data-i18n="popupAddRule"></button>
    </div>

    <button id="add-site" class="add-site" type="button" hidden>
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8.75 3.75a.75.75 0 0 0-1.5 0v3.5h-3.5a.75.75 0 0 0 0 1.5h3.5v3.5a.75.75 0 0 0 1.5 0v-3.5h3.5a.75.75 0 0 0 0-1.5h-3.5v-3.5z"/></svg>
      <span id="add-site-label"></span>
    </button>
  </main>

  <footer class="actions">
    <fieldset class="mode">
      <legend class="mode-label" data-i18n="popupModeLabel"></legend>
      <div class="segmented">
        <label><input type="radio" name="mode" value="collect"><span data-i18n="modeCollect"></span></label>
        <label><input type="radio" name="mode" value="perWindow"><span data-i18n="modePerWindow"></span></label>
      </div>
      <p id="mode-hint" class="hint muted"></p>
    </fieldset>

    <button id="go" class="btn primary go" type="button" disabled></button>

    <div id="status" class="status" role="status" aria-live="polite" hidden>
      <span id="status-text"></span>
      <button id="status-undo" class="link-btn" type="button" data-i18n="popupUndo" hidden></button>
    </div>

    <div class="foot-meta">
      <span id="shortcut" class="muted"></span>
      <button id="undo" class="link-btn" type="button" data-i18n="popupUndoLast" hidden></button>
    </div>
  </footer>

  <script src="../shared/rules.js"></script>
  <script src="../shared/settings.js"></script>
  <script src="../shared/grouping.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
